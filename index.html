<style>
  :root {
    --bg: #0b0e14;
    --tile: #131822;
    --tile-border: #232b3a;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --green: #3ddc84;
    --red: #ff5c5c;
    --gray: #5b6478;
    --accent: #6ea8fe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 20px 56px;
    max-width: 1280px;
    margin: 0 auto;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img { max-width: 100%; }
  a { color: var(--accent); }

  /* ---- header ---- */
  .site-head {
    position: sticky; top: 0; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px;
    margin: 0 -20px 16px; padding: 12px 20px;
    background: rgba(11,14,20,.84);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--tile-border);
    animation: rise .45s ease both;
  }
  @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
    .site-head { background: var(--bg); }
  }
  .head-brand {
    display: inline-flex; align-items: center; gap: 12px;
    text-decoration: none; color: var(--text);
  }
  .head-name { font-size: 1.3rem; letter-spacing: 0.02em; font-weight: 750; margin: 0; }
  .statusline {
    margin-bottom: 18px; font-size: 0.8rem; color: var(--muted);
    display: flex; gap: 14px; flex-wrap: wrap;
  }
  .statusline .ok { color: var(--green); }
  .statusline .bad { color: var(--red); }
  #hero, #tiles { scroll-margin-top: 76px; }
  @media (prefers-reduced-motion: reduce) {
    .site-head { animation: none; }
  }

  /* ---- page/section transitions ---- */
  html { scroll-behavior: smooth; }
  .reveal {
    opacity: 0; transform: translateY(18px);
    transition: opacity .55s ease, transform .55s ease;
  }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .reveal { opacity: 1; transform: none; transition: none; }
  }

  /* ---- featured carousel ---- */
  .hero {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    border: 1px solid var(--tile-border);
    background: #0a0d13;
    aspect-ratio: 21 / 9;
    margin-bottom: 22px;
    /* entrance handled by .reveal section transitions, not the tile rise */
  }
  .hero-track { position: absolute; inset: 0; }
  .hero-slide {
    position: absolute; inset: 0;
    display: block;
    opacity: 0; visibility: hidden;
    transition: opacity .55s ease, visibility 0s linear .55s;
  }
  .hero-slide.active {
    opacity: 1; visibility: visible;
    transition: opacity .55s ease;
    z-index: 1;
  }
  .hero-slide img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: center;
    display: block;
  }
  .hero-scrim {
    position: absolute; inset: auto 0 0 0;
    padding: 72px 24px 20px;
    background: linear-gradient(to top, rgba(5,7,11,.9) 0%, rgba(5,7,11,0) 100%);
  }
  .hero-name { font-size: 1.5rem; font-weight: 750; letter-spacing: 0.01em; color: var(--text); }
  .hero-tag { color: #c4cad8; margin-top: 6px; font-size: 0.95rem; }
  .hero-ui {
    position: absolute; right: 16px; bottom: 16px; z-index: 2;
    display: flex; align-items: center; gap: 10px;
  }
  .hero-dots { display: flex; gap: 7px; align-items: center; }
  .hero-dot {
    width: 22px; height: 4px; border-radius: 2px; border: 0; padding: 0;
    background: rgba(255,255,255,.28); cursor: pointer;
  }
  .hero-dot[aria-selected="true"] { background: #fff; }
  .hero-arrow {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(10,13,19,.55); color: #fff; font-size: 1rem; line-height: 1;
    cursor: pointer; padding: 0;
  }
  .hero-arrow:hover { background: rgba(10,13,19,.85); }
  @media (max-width: 640px) {
    .hero { aspect-ratio: 16 / 11; }
    .hero-name { font-size: 1.15rem; }
    .hero-tag { font-size: 0.85rem; }
    .hero-scrim { padding: 56px 128px 18px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero { animation: none; }
    .hero-slide { transition: none; }
  }

  /* ---- controls ---- */
  .controls {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    margin: 18px 0 12px;
  }
  .search {
    flex: 1 1 220px; background: var(--tile); border: 1px solid var(--tile-border);
    color: var(--text); border-radius: 10px; padding: 10px 14px; font-size: 0.9rem;
  }
  .search::placeholder { color: var(--muted); }
  .sortwrap { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.85rem; }
  .sortwrap select {
    background: var(--tile); border: 1px solid var(--tile-border); color: var(--text);
    border-radius: 10px; padding: 9px 10px; font-size: 0.85rem;
  }
  .showing { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .chip {
    background: transparent; border: 1px solid var(--tile-border); color: var(--muted);
    border-radius: 999px; padding: 7px 14px; font-size: 0.8rem; cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b0e14; font-weight: 600; }

  /* ---- tile grid ---- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 24px;
  }
  .tile {
    background: var(--tile);
    border: 1px solid var(--tile-border);
    /* Category accent bar: binds the name to its tile and keeps tiles
       visually distinct from the row above. */
    border-top: 3px solid var(--tile-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    animation: rise .45s ease both;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .tile.cat-apps    { border-top-color: #6ea8fe; }
  .tile.cat-trading { border-top-color: #3ddc84; }
  .tile.cat-infra   { border-top-color: #f5a524; }
  .tile.cat-docs    { border-top-color: #e58aa8; }
  .tile:hover {
    transform: translateY(-4px);
    border-color: #3d4b66;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .5);
  }
  .tile.wide { grid-column: span 2; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tile { animation: none; transition: none; }
    .tile:hover { transform: none; }
  }
  .tile-shot {
    aspect-ratio: 16 / 9;
    overflow: hidden;
    background: #0a0d13;
    border-bottom: 1px solid var(--tile-border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .tile-shot img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top;
    display: block;
    transition: transform .25s ease;
  }
  .tile:hover .tile-shot img { transform: scale(1.03); }
  @media (prefers-reduced-motion: reduce) {
    .tile-shot img { transition: none; }
    .tile:hover .tile-shot img { transform: none; }
  }
  /* keyboard focus: visible ring on tiles, nav, carousel — matches the dark aesthetic */
  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 6px;
  }
  /* skip-to-content: invisible until keyboard focus, then slides into view */
  .skip {
    position: absolute; left: 12px; top: -60px; z-index: 200;
    background: var(--accent); color: #0b0e14;
    font-weight: 700; text-decoration: none;
    padding: 10px 16px; border-radius: 8px;
    transition: top .18s ease;
  }
  .skip:focus-visible { top: 12px; }
  .tile-shot.empty span {
    color: var(--muted); font-size: 0.7rem;
    letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tile-body { padding: 14px 18px 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
  .tile-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .cat {
    font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray); flex-shrink: 0; }
  .dot.up { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.down { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .tile h2 { font-size: 1.22rem; font-weight: 750; letter-spacing: 0.01em; line-height: 1.25; }
  .tile h2 a { color: var(--text); text-decoration: none; }
  .tile h2 a:hover { color: var(--accent); }
  .tile h2 a::after { content: ""; position: absolute; inset: 0; }
  .tile { position: relative; }
  .desc {
    color: var(--muted); font-size: 0.86rem; line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .tile-foot {
    margin-top: auto; padding-top: 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .tile-links { display: flex; gap: 12px; position: relative; z-index: 1; }
  .tile-links a { font-size: 0.8rem; text-decoration: none; }
  .tile-links a:hover { text-decoration: underline; }
  .tile-status { display: flex; align-items: center; gap: 7px; font-size: 0.72rem; color: var(--muted); }
  .tile-status .sd { width: 7px; height: 7px; border-radius: 50%; background: var(--gray); }
  .tile-status.up .sd { background: var(--green); }
  .tile-status.up { color: var(--green); }
  .tile-status.down .sd { background: var(--red); }
  .tile-status.down { color: var(--red); }

  .empty {
    grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0;
  }
  .error { color: var(--red); margin-top: 16px; }

  /* ---- footer ---- */
  footer {
    margin-top: 56px; padding-top: 24px;
    border-top: 1px solid var(--tile-border);
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  footer .note { color: var(--muted); font-size: 0.78rem; max-width: 560px; line-height: 1.5; }
  footer .note a { color: var(--muted); }
  .dogs-foot a {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--muted); font-size: 0.82rem;
  }
  .dogs-foot img { height: 30px; width: auto; display: block; }
  .dogs-foot b { color: var(--text); }

  @media (max-width: 640px) {
    body { padding: 20px 14px 48px; }
    .site-head { margin: 0 -14px 16px; padding: 10px 14px; gap: 8px; }
    .head-brand { gap: 8px; min-width: 0; }
    .head-name { font-size: 1.05rem; white-space: nowrap; }
    .tiles { grid-template-columns: 1fr; }
    .tile.wide { grid-column: span 1; }
  }
  /* ---- 1440px polish: cinematic desktop, intentional breathing room ---- */
  @media (min-width: 1240px) {
    /* Hero: wider cinematic frame and bolder scrim type. */
    .hero { aspect-ratio: 24 / 9; margin-bottom: 28px; }
    .hero-scrim { padding: 88px 32px 26px; }
    .hero-name { font-size: 1.75rem; }
    .hero-tag { font-size: 1.05rem; }
    /* Tile grid: same 4-up column count as below, wider gutters so each
       tile breathes at 1440px instead of packing edge-to-edge. */
    .tiles { gap: 28px; }
    .tile-body { padding: 16px 20px; }
    .tile h2 { font-size: 1.28rem; }
    /* Controls: generous top rhythm; footer gets a roomier closer. */
    .controls { margin: 22px 0 14px; }
    .chips { margin-bottom: 22px; }
    footer { margin-top: 72px; }
  }
  /* ---- 390px polish: phone-first spacing and breathing room ---- */
  @media (max-width: 480px) {
    body { padding: 16px 12px 44px; }
    .site-head { margin: 0 -12px 12px; padding: 10px 12px; }
    /* Featured: carousel controls move to the top so the scrim copy gets
       the full width instead of a 128px carve-out. */
    .hero-ui { top: 10px; bottom: auto; right: 10px; }
    .hero-scrim { padding: 64px 18px 16px; }
    .hero-name { font-size: 1.05rem; }
    .hero-tag { font-size: 0.82rem; }
    .hero-arrow { width: 36px; height: 36px; }
    /* Controls: search owns its row; sort + count share the next. */
    .controls { gap: 10px; margin: 14px 0 10px; }
    .search { flex: 1 1 100%; }
    .showing { margin-left: 0; }
    .chips { margin-bottom: 14px; gap: 7px; }
    .chip { padding: 6px 12px; }
    /* Tiles: single column, tighter body, readable name at a glance. */
    .tiles { gap: 18px; }
    .tile h2 { font-size: 1.12rem; }
    .tile-body { padding: 12px 14px; gap: 8px; }
    .desc { font-size: 0.84rem; }
    .tile-foot { padding-top: 8px; }
    /* Footer: stack centered on a narrow screen. */
    footer { flex-direction: column; align-items: center; text-align: center; margin-top: 44px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-head">
  <a class="head-brand" href="./" aria-label="Watchtower — back to top">
    <h1 class="head-name">Watchtower</h1>
  </a>
</header>
<p class="statusline" id="statusline" aria-live="polite">
  <span id="proj-count">…</span>
  <span id="site-summary">…</span>
  <span>Updated <span id="updated">…</span></span>
</p>

<section class="hero" id="hero" aria-label="Featured projects" hidden>
  <div class="hero-track" id="hero-track"></div>
  <div class="hero-ui">
    <div class="hero-dots" id="hero-dots" role="tablist" aria-label="Featured slides"></div>
    <button class="hero-arrow" id="hero-prev" type="button" aria-label="Previous featured project">&#8249;</button>
    <button class="hero-arrow" id="hero-next" type="button" aria-label="Next featured project">&#8250;</button>
  </div>
</section>

<main id="main">
  <div class="controls" role="search">
    <label for="q" class="sr-only" style="position:absolute;left:-9999px">Search projects</label>
    <input id="q" class="search" type="search" placeholder="Search projects…" autocomplete="off" aria-label="Search projects">
    <div class="sortwrap">
      <label for="sort">Sort</label>
      <select id="sort" aria-label="Sort projects">
        <option value="featured">Featured</option>
        <option value="name">Name A–Z</option>
        <option value="status">Status</option>
        <option value="updated">Recently updated</option>
        <option value="category">Category</option>
      </select>
    </div>
    <span class="showing" id="showing"></span>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by category"></div>
  <div class="tiles" id="tiles"></div>
  <div id="err"></div>
  <noscript>
    <p style="color:#8b93a7;margin-top:20px">Watchtower's project tiles need JavaScript to load live status data. The raw project list is available in <a href="data.json" style="color:#6ea8fe">data.json</a>.</p>
  </noscript>
</main>

<footer>
  <div class="dogs-foot">
    <a href="https://wearedogs.net"><img src="assets/made-by-dogs.webp" alt="DOGS" width="360" height="119"></a>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var FEATURED = ["castle"];
  // tower / watchtower / demo are all the same project — the portfolio
  // itself. It doesn't monitor its own uptime, so it gets no tile.
  var HIDDEN = ["tower", "watchtower", "demo", "yeahdogs.github.io"];
  // icecream sinks to the bottom of every sort — other work comes first.
  var SUNK = ["icecream"];
  var INFRA = ["castle", "castle-os", "tower", "watchtower", "phoenix",
               "chains", "id", "sdm", "remote", "yeahdogs.github.io"];
  var CATS = ["All", "Apps", "Trading", "Infra", "Docs"];

  function category(name) {
    if (name === "paper") return "Trading";
    if (name === "plans") return "Docs";
    if (INFRA.indexOf(name) !== -1) return "Infra";
    return "Apps";
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }

  function relTime(iso) {
    if (!iso) return "unknown";
    var then = new Date(iso).getTime();
    if (isNaN(then)) return "unknown";
    var s = Math.max(0, Math.floor((Date.now() - then) / 1000));
    if (s < 60) return "just now";
    var m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    var h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    var d = Math.floor(h / 24);
    if (d < 30) return d + "d ago";
    return new Date(iso).toISOString().slice(0, 10);
  }

  // Watchtower live-site status. Never a fake green: unknown when the feed
  // is unavailable or the repo has no monitored site.
  function siteInfo(r, available) {
    if (!available) return { cls: "", text: "site status unavailable", rank: 1 };
    var s = r.site;
    if (!s) return { cls: "", text: "not monitored", rank: 1 };
    var ago = "checked " + relTime(s.lastCheck);
    var ms = (s.responseMs === null || s.responseMs === undefined) ? "" : " · " + s.responseMs + "ms";
    if (s.status === "up") return { cls: "up", text: "LIVE — " + ago + ms, rank: 0 };
    if (s.status === "down") return { cls: "down", text: "DOWN — " + ago, rank: 2 };
    return { cls: "", text: "status unknown", rank: 1 };
  }

  function tileShot(r) {
    var e = null;
    (r.progress || []).forEach(function (p) {
      if (!e && p.kind === "screenshot" && (p.thumb || p.url)) e = p;
    });
    // Fallback: generated key art so no tile is ever a blank void.
    if (!e && r.art) e = { url: r.art, title: r.name + " key art" };
    var d = el("div", "tile-shot" + (e ? "" : " empty"));
    if (e) {
      var img = document.createElement("img");
      img.src = e.thumb || e.url;
      img.alt = e.title || (r.name + " screenshot");
      img.loading = "lazy";
      d.appendChild(img);
      d.title = e.title;
    } else {
      d.appendChild(el("span", null, "no screenshot yet"));
      d.title = "No live site to screenshot — check back soon";
    }
    return d;
  }

  function tile(r, siteAvail) {
    var a = el("article", "tile" + (FEATURED.indexOf(r.name) !== -1 ? " wide" : "") +
      " cat-" + (r.category || "Apps").toLowerCase());
    a.setAttribute("aria-label", r.name);

    // Image-first: screenshot on top so every tile is visually distinct.
    a.appendChild(tileShot(r));

    var body = el("div", "tile-body");

    // Name directly under its own image: the header reads as this tile's
    // title, never as the tail of the tile above it.
    var h = el("h2");
    var ra = el("a", null, r.name);
    ra.href = r.hub || r.url; // tile opens the project hub page, never GitHub directly
    h.appendChild(ra);
    body.appendChild(h);

    var top = el("div", "tile-top");
    top.appendChild(el("span", "cat", r.category));
    // Group tiles (e.g. Castle) collapse member repos into one hub entry.
    var si = r.isGroup
      ? { cls: "", text: "project hub — " + r.modules + " modules inside", rank: 1 }
      : siteInfo(r, siteAvail);
    var dot = el("span", "dot " + si.cls);
    dot.title = si.text;
    top.appendChild(dot);
    body.appendChild(top);

    // Tile copy: TAGLINES override (3-6 words); raw repo description
    // stays on the object for search filtering only.
    var blurb = TAGLINES[r.name] || r.description;
    if (blurb) body.appendChild(el("p", "desc", blurb));

    var foot = el("div", "tile-foot");
    var links = el("div", "tile-links");
    if (r.pages) {
      var pa = el("a", null, "Live site");
      pa.href = r.pages; pa.target = "_blank"; pa.rel = "noopener";
      links.appendChild(pa);
    }
    // GitHub repo links live on the hub page, not on the tile.
    foot.appendChild(links);

    var st = el("div", "tile-status " + si.cls);
    st.appendChild(el("span", "sd"));
    st.appendChild(el("span", null, si.text));
    foot.appendChild(st);
    body.appendChild(foot);

    a.appendChild(body);
    return a;
  }

  // Tile taglines: name + 3-6 words on every tile, no paragraphs.
  // Overrides the raw GitHub repo descriptions (kept only for search).
  var TAGLINES = {
    "news": "Independent news, no spin.",
    "40": "Self-deleting social media.",
    "phoenix": "Fresh start for devices.",
    "sdm": "Dating for the wild.",
    "proof": "Facts on world vices.",
    "playback": "DJ booth in browser.",
    "pay": "Peer-to-peer payments.",
    "help": "Give back, DOGS style.",
    "bakery": "Parallel swarm manager.",
    "divorce": "DIY Oklahoma divorce.",
    "sampler": "AI sample finder.",
    "icecream": "The global ice cream landscape.",
    "wax": "Vinyl drop alerts.",
    "remote": "Universal TV remote.",
    "chains": "Git for save data.",
    "id": "Age verification gate.",
    "paper": "Fake money, real lessons.",
    "mirror": "Smart mirror dashboard.",
    "forge": "LLC formation wizard.",
    "printshop": "Printable 3D assets.",
    "radio": "24/7 community radio.",
    "dog": "Byte-minimal text format.",
    "castle": "Your data, your network, your rules."
  };

  // ---- featured carousel ----
  var CAROUSEL = ["castle", "icecream", "wax", "phoenix"];
  // Short taglines only: name + 3-6 words on every slide, no paragraphs.
  var CAROUSEL_TAGS = {
    "castle": "Your data, your rules.",
    "icecream": "The global ice cream landscape.",
    "wax": "Vinyl drop alerts.",
    "phoenix": "A fresh start for devices."
  };

  function slideImg(r) {
    var e = null;
    (r.progress || []).forEach(function (p) {
      if (!e && p.kind === "screenshot" && (p.thumb || p.url)) e = p;
    });
    // Same fallback as tiles: generated key art so a slide is never blank.
    if (!e && r.art) e = { url: r.art, title: r.name + " key art" };
    return e;
  }

  var heroIdx = 0, heroTimer = null, heroCount = 0;
  var reduceMotion = window.matchMedia &&
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function heroShow(n) {
    var slides = document.querySelectorAll("#hero-track .hero-slide");
    var dots = document.querySelectorAll("#hero-dots .hero-dot");
    if (!slides.length) return;
    slides[heroIdx].classList.remove("active");
    dots[heroIdx].setAttribute("aria-selected", "false");
    heroIdx = ((n % slides.length) + slides.length) % slides.length;
    slides[heroIdx].classList.add("active");
    dots[heroIdx].setAttribute("aria-selected", "true");
  }

  function heroStop() {
    if (heroTimer) { clearInterval(heroTimer); heroTimer = null; }
  }

  function heroStart() {
    heroStop();
    if (!reduceMotion && heroCount > 1) {
      heroTimer = setInterval(function () { heroShow(heroIdx + 1); }, 6500);
    }
  }

  function heroGo(n) { heroShow(n); heroStart(); }

  function buildHero() {
    var items = [];
    CAROUSEL.forEach(function (slug) {
      for (var i = 0; i < state.repos.length; i++) {
        var r = state.repos[i];
        if (r.name === slug) {
          var im = slideImg(r);
          if (im) items.push({ r: r, im: im });
          break;
        }
      }
    });
    if (!items.length) return;
    var track = document.getElementById("hero-track");
    var dots = document.getElementById("hero-dots");
    items.forEach(function (it, i) {
      var a = el("a", "hero-slide");
      a.href = it.r.hub || it.r.url;
      a.setAttribute("aria-label", it.r.name + " — featured project");
      if (i === 0) a.classList.add("active");
      var img = document.createElement("img");
      img.src = it.im.thumb || it.im.url;
      img.alt = it.r.name + " preview";
      img.loading = i === 0 ? "eager" : "lazy";
      if (i === 0) img.setAttribute("fetchpriority", "high");
      a.appendChild(img);
      var scrim = el("div", "hero-scrim");
      scrim.appendChild(el("div", "hero-name", it.r.name));
      var tag = CAROUSEL_TAGS[it.r.name] || it.r.description || "";
      if (tag) scrim.appendChild(el("div", "hero-tag", tag));
      a.appendChild(scrim);
      track.appendChild(a);
      var d = el("button", "hero-dot");
      d.type = "button";
      d.setAttribute("role", "tab");
      d.setAttribute("aria-selected", i === 0 ? "true" : "false");
      d.setAttribute("aria-label", "Show " + it.r.name);
      (function (n) { d.addEventListener("click", function () { heroGo(n); }); })(i);
      dots.appendChild(d);
    });
    heroCount = items.length;
    document.getElementById("hero").hidden = false;
    if (heroCount > 1) {
      document.getElementById("hero-prev").addEventListener("click", function () { heroGo(heroIdx - 1); });
      document.getElementById("hero-next").addEventListener("click", function () { heroGo(heroIdx + 1); });
      var hero = document.getElementById("hero");
      hero.addEventListener("mouseenter", heroStop);
      hero.addEventListener("mouseleave", heroStart);
      hero.addEventListener("focusin", heroStop);
      hero.addEventListener("focusout", heroStart);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) heroStop(); else heroStart();
      });
      heroStart();
    } else {
      document.querySelector(".hero-ui").style.display = "none";
    }
  }

  // ---- page/section transitions: fade+slide each section in as it
  // enters the viewport; smooth scroll between anchor sections. Classes are
  // applied from JS so no-JS visitors never see a hidden page.
  function setupReveals() {
    var sel = "#statusline, #hero, .controls, #chips, footer";
    var els = document.querySelectorAll(sel);
    if (reduceMotion || !("IntersectionObserver" in window)) {
      Array.prototype.forEach.call(els, function (n) { n.classList.add("in"); });
      return;
    }
    Array.prototype.forEach.call(els, function (n) { n.classList.add("reveal"); });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: "0px 0px -6% 0px", threshold: 0.06 });
    Array.prototype.forEach.call(els, function (n) { io.observe(n); });
  }

  var state = { q: "", sort: "featured", cat: "All", repos: [], siteAvail: false };

  function sorters(mode) {
    return {
      featured: function (x, y) {
        var fx = FEATURED.indexOf(x.name), fy = FEATURED.indexOf(y.name);
        if ((fx !== -1) !== (fy !== -1)) return fx === -1 ? 1 : -1;
        return new Date(y.pushed_at) - new Date(x.pushed_at);
      },
      name: function (x, y) { return x.name.localeCompare(y.name); },
      status: function (x, y) {
        if (x.srank !== y.srank) return x.srank - y.srank;
        return new Date(y.pushed_at) - new Date(x.pushed_at);
      },
      updated: function (x, y) { return new Date(y.pushed_at) - new Date(x.pushed_at); },
      category: function (x, y) {
        return x.category.localeCompare(y.category) || x.name.localeCompare(y.name);
      }
    }[mode];
  }

  function render() {
    var box = document.getElementById("tiles");
    box.innerHTML = "";
    var q = state.q.trim().toLowerCase();
    var list = state.repos.filter(function (r) {
      if (state.cat !== "All" && r.category !== state.cat) return false;
      if (q && (r.name.toLowerCase().indexOf(q) === -1) &&
          (r.description || "").toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(sorters(state.sort));
    // SUNK entries always render last, whatever the sort mode.
    if (SUNK.length) {
      list.sort(function (x, y) {
        var sx = SUNK.indexOf(x.name) !== -1, sy = SUNK.indexOf(y.name) !== -1;
        if (sx !== sy) return sx ? 1 : -1;
        return 0;
      });
    }
    if (!list.length) {
      var e = el("div", "empty", "No projects match. Try a different search or category.");
      box.appendChild(e);
    } else {
      list.forEach(function (r, i) {
        var t = tile(r, state.siteAvail);
        t.style.animationDelay = Math.min(i * 45, 700) + "ms";
        box.appendChild(t);
      });
    }
    document.getElementById("showing").textContent =
      "showing " + list.length + " of " + state.repos.length;
  }

  function wireControls() {
    document.getElementById("q").addEventListener("input", function (e) {
      state.q = e.target.value;
      render();
    });
    document.getElementById("sort").addEventListener("change", function (e) {
      state.sort = e.target.value;
      render();
    });
    var chips = document.getElementById("chips");
    CATS.forEach(function (c) {
      var b = el("button", "chip", c);
      b.type = "button";
      b.setAttribute("aria-pressed", c === "All" ? "true" : "false");
      b.addEventListener("click", function () {
        state.cat = c;
        Array.prototype.forEach.call(chips.children, function (x) {
          x.setAttribute("aria-pressed", x.textContent === c ? "true" : "false");
        });
        render();
      });
      chips.appendChild(b);
    });
  }

  Promise.all([
    fetch("data.json", { cache: "no-store" }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }),
    fetch("projects/groups.json", { cache: "no-store" }).then(function (res) {
      return res.ok ? res.json() : { groups: {} };
    }).catch(function () { return { groups: {} }; })
  ])
    .then(function (parts) {
      var data = parts[0];
      var groups = (parts[1] && parts[1].groups) || {};
      if (!data || !Array.isArray(data.repos)) throw new Error("bad data");
      state.siteAvail = !!(data.site_status && data.site_status.available);
      // One tile per group (e.g. Castle); member repos never get their own tiles.
      var entries = [], members = {};
      Object.keys(groups).forEach(function (slug) {
        var g = groups[slug];
        (g.members || []).forEach(function (m) { members[m] = true; });
        // Group tiles inherit imagery from the matching repo entry in
        // data.json (generated key art + live-site screenshot), so they are
        // never blank voids.
        var src = null;
        data.repos.forEach(function (r) { if (r.name === slug) src = r; });
        entries.push({
          isGroup: true, name: g.title, slug: slug,
          description: g.tagline || g.description || "", // tagline only on tiles: 3-6 words, never a paragraph
          category: g.category || "Infra",
          hub: "projects/" + slug + "/",
          modules: (g.modules || []).length,
          pages: null, site: null, srank: 1, pushed_at: null,
          art: src ? src.art : null,
          progress: src ? (src.progress || []) : []
        });
      });
      data.repos.forEach(function (r) {
        if (members[r.name]) return;
        if (HIDDEN.indexOf(r.name) !== -1) return;
        var si = siteInfo(r, state.siteAvail);
        r.category = category(r.name);
        r.srank = si.rank;
        r.hub = r.hub || r.url; // hub page when one exists, else the repo
        entries.push(r);
      });
      state.repos = entries;
      var monitored = 0, down = 0;
      state.repos.forEach(function (r) {
        if (r.site) { monitored++; if (r.site.status === "down") down++; }
      });
      document.getElementById("proj-count").textContent =
        state.repos.length + " projects";
      var sum = document.getElementById("site-summary");
      if (state.siteAvail) {
        sum.innerHTML = "";
        sum.appendChild(el("span", null, monitored + " sites monitored · "));
        var live = monitored - down;
        var l = el("span", live === monitored ? "ok" : "", live + " live");
        sum.appendChild(l);
        if (down) {
          sum.appendChild(el("span", null, " · "));
          sum.appendChild(el("span", "bad", down + " down"));
        }
      } else {
        sum.textContent = "site status unavailable";
      }
      document.getElementById("updated").textContent =
        relTime(data.generated_at) + " (" +
        new Date(data.generated_at).toISOString().replace("T", " ").slice(0, 16) + " UTC)";
      wireControls();
      buildHero();
      render();
      setupReveals();
    })
    .catch(function (e) {
      var d = document.getElementById("err");
      d.className = "error";
      d.textContent = "Could not load Watchtower data: " + e.message;
      setupReveals();
    });
})();
</script>
</body>
</html>
